[package]
name = "napi-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "napi_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "napi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
