[package]
name = "napi-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "napi_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "napi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
toml = "0.8"
toml_edit = "0.22"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
dirs = "6"
tokio = { version = "1", features = ["process", "net", "time", "io-util", "macros", "rt-multi-thread"] }
urlencoding = "2"
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
zip = "2.2"
sha2 = "0.10"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
rfd = "0.15"
futures = "0.3"
url = "2.5"
